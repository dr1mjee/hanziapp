// Приложение — намеренно один самодостаточный HTML-файл без сборки, поэтому
// Tailwind CDN и Babel standalone используются в браузере напрямую. Это даёт

// Tailwind и precompile Babel) — они не влияют на работу приложения и не
// являются багом, поэтому глушим именно эти два сообщения, не трогая
// остальные console.warn.
(function () {
  var originalWarn = console.warn;
  var suppressed = [
    'cdn.tailwindcss.com should not be used in production',
    'in-browser Babel transformer',
  ];
  console.warn = function () {
    var msg = arguments.length ? String(arguments[0]) : '';
    for (var i = 0; i < suppressed.length; i++) {
      if (msg.indexOf(suppressed[i]) !== -1) return;
    }
    return originalWarn.apply(console, arguments);
  };
})();
</script>

// Общий список слов для словаря (поиск ведётся по всем изученным уровням)
const ALL_WORDS = HSK1_WORDS.concat(HSK2_WORDS).concat(HSK3_WORDS).concat(HSK4_WORDS).concat(HSK5_WORDS);

// Сопоставление иероглифа с официальным уровнем HSK 2.0 (по спискам HSK1–5
// — уровни, заполненные реальными словами). Используется, чтобы показывать
// корректный бейдж HSK у слов из учебников Boya, у которых собственного поля
// уровня нет — так же, как это уже сделано в словаре.
const HSK_LEVEL_BY_HANZI = {};
HSK1_WORDS.forEach(function (w) { if (!(w.hanzi in HSK_LEVEL_BY_HANZI)) HSK_LEVEL_BY_HANZI[w.hanzi] = 1; });
HSK2_WORDS.forEach(function (w) { if (!(w.hanzi in HSK_LEVEL_BY_HANZI)) HSK_LEVEL_BY_HANZI[w.hanzi] = 2; });
HSK3_WORDS.forEach(function (w) { if (!(w.hanzi in HSK_LEVEL_BY_HANZI)) HSK_LEVEL_BY_HANZI[w.hanzi] = 3; });
HSK4_WORDS.forEach(function (w) { if (!(w.hanzi in HSK_LEVEL_BY_HANZI)) HSK_LEVEL_BY_HANZI[w.hanzi] = 4; });
HSK5_WORDS.forEach(function (w) { if (!(w.hanzi in HSK_LEVEL_BY_HANZI)) HSK_LEVEL_BY_HANZI[w.hanzi] = 5; });

// Возвращает известный уровень HSK 2.0 для слова (1–5) или null, если слово
// пока не входит ни в один заполненный уровень HSK (например, специфичная
// для учебника лексика уровня HSK6, которого в приложении ещё нет).
function wordHskLevel(word) {
  if (!word) return null;
  if (word.id.indexOf('w2_') === 0) return 2;
  if (word.id.indexOf('w3_') === 0) return 3;
  if (word.id.indexOf('w4_') === 0) return 4;
  if (word.id.indexOf('w5_') === 0) return 5;
  if (/^w\d+$/.test(word.id)) return 1;
  var byHanzi = HSK_LEVEL_BY_HANZI[word.hanzi];
  return byHanzi || null;
}

// ==========================================================================
// АЛГОРИТМ ОБУЧЕНИЯ
//
// У каждого слова один трек прогресса. Новое слово при первой встрече
// проходит через мини-цикл из 4 шагов (в этом порядке):
//   1) Смотри          — карточка: иероглиф + чтение + перевод
//   2) Порядок черт    — анимация того, как иероглиф пишется по-настоящему
//   3) Обведи иероглиф — обводим образец (реальные черты, не оценивается)
//   4) Пиши от руки    — пишем по памяти, реальная проверка каждой черты
// Стартовый этап SRS зависит от результата шага 4.
// Дальше слово участвует в интервальном повторении: этапы 1–3 показываются
// в формате "узнавание" (случайное направление, без пиньиня), этапы 4–6 —
// в формате "письмо". Повторение уже изученных слов запускается отдельно
// (кнопка "Учить слова" на главном экране) и никогда не включает новые,
// ещё не изученные слова.
// ==========================================================================
const SRS_INTERVALS_MS = [
  0,                        // stage 0 — новое слово, ещё не проходило цикл знакомства
  10 * 60 * 1000,           // stage 1 — 10 минут
  60 * 60 * 1000,           // stage 2 — 1 час
  24 * 60 * 60 * 1000,      // stage 3 — 1 день
  3 * 24 * 60 * 60 * 1000,  // stage 4 — 3 дня (переходим к формату "письмо")
  7 * 24 * 60 * 60 * 1000,  // stage 5 — 7 дней
  14 * 24 * 60 * 60 * 1000, // stage 6 — 14 дней, слово считается выученным
];
const MAX_STAGE = SRS_INTERVALS_MS.length - 1; // 6
const LEARNED_STAGE = 5; // с этого этапа считаем слово "изученным" для прогресс-кольца
const WRITE_FROM_STAGE = 4; // с этого этапа повторяем в формате "письмо", а не "узнавание"

function defaultProgress() {
  return { stage: 0, dueAt: 0 };
}
function getProgress(progress, wordId) {
  return progress[wordId] || defaultProgress();
}

// Пересчитывает этап после обычного (не вводного) повторения
function nextStageState(current, correct) {
  var stage = correct ? Math.min(current.stage + 1, MAX_STAGE) : 1;
  return { stage: stage, dueAt: Date.now() + SRS_INTERVALS_MS[stage] };
}

// Стартовый этап по итогам вводного цикла знакомства со словом (по шагу "Пиши от руки")
function introStartState(writeCorrect) {
  var stage = writeCorrect ? 3 : 1;
  return { stage: stage, dueAt: Date.now() + SRS_INTERVALS_MS[stage] };
}

function randomDirection() {
  return Math.random() < 0.5 ? 'char2trans' : 'trans2char';
}

// Если слово состоит из повторяющихся иероглифов (например 谢谢), при обводке/
// написании/показе анимации черт каждый уникальный иероглиф практикуем один раз
function uniqueChars(hanzi) {
  var seen = {};
  var result = [];
  hanzi.split('').forEach(function (ch) {
    if (!seen[ch]) { seen[ch] = true; result.push(ch); }
  });
  return result;
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function chunksToQueue(chunks) {
  var queue = [];
  shuffle(chunks).forEach(function (chunk) {
    chunk.forEach(function (t) { queue.push(t); });
  });
  return queue;
}

// Строит очередь карточек для тренировки по списку id-слов (используется
// в "Списках"/уроках). Новые слова получают блок из 4 шагов подряд
// (знакомство: смотри → порядок черт → обведи → пиши), слова на
// повторении — один шаг ("узнавание" или "письмо" в зависимости от этапа).
function buildSessionQueue(progress, wordIds, now) {
  var chunks = [];
  wordIds.forEach(function (id) {
    var p = getProgress(progress, id);
    if (p.stage === 0) {
      chunks.push([
        { wordId: id, kind: 'look', isIntro: true },
        { wordId: id, kind: 'animate', isIntro: true },
        { wordId: id, kind: 'trace', isIntro: true },
        { wordId: id, kind: 'write', isIntro: true },
      ]);
    } else if (p.dueAt <= now) {
      if (p.stage < WRITE_FROM_STAGE) {
        chunks.push([{ wordId: id, kind: 'recognize', direction: randomDirection(), isIntro: false }]);
      } else {
        chunks.push([{ wordId: id, kind: 'write', isIntro: false }]);
      }
    }
  });
  return chunksToQueue(chunks);
}

// Очередь ТОЛЬКО для повторения уже изученных слов (кнопка "Учить слова" на
// главном экране) — новые (этап 0) слова сюда никогда не попадают. mode
// позволяет выбрать формат тренировки вручную: 'auto' (по умолчанию, формат
// зависит от этапа SRS слова), 'write' (пропись по памяти для всех слов),
// 'recognize' (карточки-узнавание для всех слов).
function buildReviewQueue(progress, wordIds, now, mode) {
  var chunks = [];
  wordIds.forEach(function (id) {
    var p = getProgress(progress, id);
    if (p.stage >= 1 && p.dueAt <= now) {
      if (mode === 'write') {
        chunks.push([{ wordId: id, kind: 'write', isIntro: false }]);
      } else if (mode === 'recognize') {
        chunks.push([{ wordId: id, kind: 'recognize', direction: randomDirection(), isIntro: false }]);
      } else if (p.stage < WRITE_FROM_STAGE) {
        chunks.push([{ wordId: id, kind: 'recognize', direction: randomDirection(), isIntro: false }]);
      } else {
        chunks.push([{ wordId: id, kind: 'write', isIntro: false }]);
      }
    }
  });
  return chunksToQueue(chunks);
}

function hasAnyStartedWord(progress, wordIds) {
  return wordIds.some(function (id) { return getProgress(progress, id).stage >= 1; });
}

function countReviewDue(progress, wordIds, now) {
  var count = 0;
  wordIds.forEach(function (id) {
    var p = getProgress(progress, id);
    if (p.stage >= 1 && p.dueAt <= now) count++;
  });
  return count;
}

// Список слов, которые реально нужно повторить прямо сейчас (этап начат и
// подошёл срок). Используется, чтобы ограничить размер сессии повторения
// настройкой "слов за повторение" — без этого "Учить слова" разом кидало бы
// в тренировку вообще все просроченные слова, что при большом словаре может
// быть очень длинной сессией.
function dueWordIds(progress, wordIds, now) {
  return wordIds.filter(function (id) {
    var p = getProgress(progress, id);
    return p.stage >= 1 && p.dueAt <= now;
  });
}

function countLearned(progress, wordIds) {
  var count = 0;
  wordIds.forEach(function (id) {
    if (getProgress(progress, id).stage >= LEARNED_STAGE) count++;
  });
  return count;
}

// Средняя доля прохождения слов из списка (0..1), с частичным зачётом за
// каждый пройденный этап SRS, а не только за полностью "выученные" слова.
// Используется для кольца прогресса на главном экране: если считать только
// countLearned (этап 5+, для этого нужно реально ждать неделями между
// повторениями), кольцо может неделями оставаться пустым даже при активных
// ежедневных занятиях — так прогресс виден сразу, честно отражая усилия.
function averageProgressFraction(progress, wordIds) {
  if (!wordIds.length) return 0;
  var sum = 0;
  wordIds.forEach(function (id) {
    var stage = getProgress(progress, id).stage;
    sum += Math.min(stage, LEARNED_STAGE) / LEARNED_STAGE;
  });
  return sum / wordIds.length;
}



// Снятие тонов с пиньиня — чтобы поиск находил слово по вводу без тонов
var TONE_MAP = {
  'ā': 'a', 'á': 'a', 'ǎ': 'a', 'à': 'a',
  'ē': 'e', 'é': 'e', 'ě': 'e', 'è': 'e',
  'ī': 'i', 'í': 'i', 'ǐ': 'i', 'ì': 'i',
  'ō': 'o', 'ó': 'o', 'ǒ': 'o', 'ò': 'o',
  'ū': 'u', 'ú': 'u', 'ǔ': 'u', 'ù': 'u',
  'ǖ': 'v', 'ǘ': 'v', 'ǚ': 'v', 'ǜ': 'v', 'ü': 'v',
};
function stripTones(str) {
  return str.toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, function (ch) {
    return TONE_MAP[ch] || ch;
  });
}

function matchesQuery(word, query) {
  var q = stripTones(query.trim());
  if (!q) return false;
  return (
    word.hanzi.indexOf(query.trim()) !== -1 ||
    stripTones(word.pinyin).indexOf(q) !== -1 ||
    stripTones(word.translation).indexOf(q) !== -1
  );
}

// ==========================================================================
// АКТИВНОСТЬ ПО ДНЯМ (для графика на главном экране: Пн–Вс)
// ==========================================================================
function dateKey(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function todayKey() { return dateKey(new Date()); }

function bumpActivity(activityLog, key, amount) {
  var next = {};
  Object.assign(next, activityLog);
  next[key] = (next[key] || 0) + amount;
  return next;
}

var WEEKDAY_LABELS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

// Возвращает массив из 7 объектов {label, count, isToday} для текущей недели (Пн→Вс)
function getWeekActivity(activityLog) {
  var now = new Date();
  var jsDay = now.getDay(); // 0=Вс,1=Пн,...6=Сб
  var mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
  var todayK = dateKey(now);
  var result = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    var key = dateKey(d);
    result.push({ label: WEEKDAY_LABELS[i], count: activityLog[key] || 0, isToday: key === todayK });
  }
  return result;
}

// Текущий стрик — число дней подряд (включая сегодня, либо со вчера, если
// сегодня ещё не позанимались), в которые в activityLog есть хотя бы одно
// выученное слово. Используется в профиле пользователя.
function getCurrentStreak(activityLog) {
  var now = new Date();
  var streak = 0;
  var cursor = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (!activityLog[dateKey(cursor)]) {
    cursor.setDate(cursor.getDate() - 1);
    if (!activityLog[dateKey(cursor)]) return 0;
  }
  while (activityLog[dateKey(cursor)]) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

  try {
    var raw = localStorage.getItem(STORAGE_PROGRESS_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}
function saveProgress(progress) {
  try {
    localStorage.setItem(STORAGE_PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) { /* ignore quota / privacy-mode errors */ }
}

  try {
    var raw = localStorage.getItem(STORAGE_LISTS_KEY);
    if (!raw) return [];
    return JSON.parse(raw);
  } catch (e) {
    return [];
  }
}
function saveLists(lists) {
  try {
    localStorage.setItem(STORAGE_LISTS_KEY, JSON.stringify(lists));
  } catch (e) { /* ignore */ }
}
function loadActivity() {
  try {
    var raw = localStorage.getItem(STORAGE_ACTIVITY_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}

  try {
    localStorage.setItem(STORAGE_ACTIVITY_KEY, JSON.stringify(activityLog));
  } catch (e) { /* ignore */ }
}

var STORAGE_PROFILE_KEY = 'hanzi-app-profile-v1';
var DEFAULT_PROFILE = { name: '', photo: '' };
function loadProfile() {
  try {
    var raw = localStorage.getItem(STORAGE_PROFILE_KEY);
    if (!raw) return DEFAULT_PROFILE;
    return Object.assign({}, DEFAULT_PROFILE, JSON.parse(raw));
  } catch (e) {
    return DEFAULT_PROFILE;
  }
}
function saveProfile(profile) {
  try {
    localStorage.setItem(STORAGE_PROFILE_KEY, JSON.stringify(profile));
  } catch (e) { /* ignore */ }
}

// приложение": тема, размер текста, цель на день, напоминание, голос озвучки.
// Тоже только локально, в этом браузере.
var STORAGE_SETTINGS_KEY = 'hanzi-app-settings-v1';
var DEFAULT_SETTINGS = { theme: 'light', voiceURI: '', vibration: true, defaultLevel: '1', reviewBatchSize: 20 };
var APP_VERSION = '1.0';
function loadSettings() {

    var raw = localStorage.getItem(STORAGE_SETTINGS_KEY);
    if (!raw) return DEFAULT_SETTINGS;
    return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
  } catch (e) {
    return DEFAULT_SETTINGS;
  }
}

// Текущий голос озвучки — читается из настроек, применяется в speak().
// Хранится отдельно от React-состояния, т.к. speak() дёргается из множества
// независимых карточек тренировки.
var currentVoiceURI = '';

// Сохранение текущей тренировки (очередь + позиция), чтобы при возврате в
// тот же самый раздел можно было продолжить с того же места
var STORAGE_SESSION_KEY = 'hanzi-app-session-v1';

function sessionKeyFor(scope) {
  var ids = scope.wordIds.slice().sort().join(',');
  return (scope.reviewOnly ? 'review:' : 'learn:') + ids.length + ':' + ids.slice(0, 400);
}
function loadSessionState() {
  try {
    var raw = localStorage.getItem(STORAGE_SESSION_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}
function saveSessionState(key, queue, index) {
  try {
    localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify({ key: key, queue: queue, index: index }));
  } catch (e) { /* ignore — прогресс по словам всё равно уже сохранён отдельно */ }
}
function clearSessionState() {
  try { localStorage.removeItem(STORAGE_SESSION_KEY); } catch (e) { /* ignore */ }
}

function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    if (currentVoiceURI) {
      var voices = window.speechSynthesis.getVoices();
      var match = voices.filter(function (v) { return v.voiceURI === currentVoiceURI; })[0];
      if (match) u.voice = match;
    }
    window.speechSynthesis.speak(u);
  } catch (e) { /* speech synthesis unavailable — fail silently */ }
}

// Тактильный отклик (вибрация). Поддерживается не везде (например, не на iOS
// Safari) — вызывается безопасно, без падения на неподдерживающих устройствах.
// Включена ли вибрация — читается из настроек. Хранится отдельно от
// React-состояния, т.к. vibrate() вызывается из множества независимых мест.
var currentVibrationEnabled = true;

function vibrate(pattern) {
  try {
    if (!currentVibrationEnabled) return;
    if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(pattern);
  } catch (e) { /* not supported — ignore */ }
}

// Линейная интерполяция между двумя hex-цветами (для лёгкой подсветки при свайпе)
function lerpColor(hexA, hexB, t) {
  var a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
  var ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
  var br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
  var r = Math.round(ar + (br - ar) * t);
  var g = Math.round(ag + (bg - ag) * t);
  var bl = Math.round(ab + (bb - ab) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// Круговая диаграмма прогресса. Линия — светло-серая, прогресс — чёрный.
function ProgressRing(props) {
  var pct = Math.max(0, Math.min(1, props.pct));
  var size = 220;
  var stroke = 10;
  var r = (size - stroke) / 2;
  var circumference = 2 * Math.PI * r;
  var offset = circumference * (1 - pct);
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={'0 0 ' + size + ' ' + size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#E0E0E0" strokeWidth={stroke} />
        <circle
          cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#000000" strokeWidth={stroke}
          strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: 'stroke-dashoffset 0.6s ease' }}
        />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <div className="text-lg font-semibold tracking-wide">{props.centerTitle}</div>
        <div className="text-sm text-black/60 mt-1">{props.centerSubtitle}</div>

}

// Обёртка "свайп влево → кнопка удалить" для строк списков. Тянем содержимое
// пальцем/мышью, за ним открывается красная кнопка; отпустили — либо
// докрывает до конца, либо плавно возвращается на место. Само удаление
// сопровождается плавным схлопыванием строки (высота + прозрачность), чтобы
// приложение не "дёргалось", когда элемент исчезает.
function SwipeToDelete(props) {
  var revealWidth = props.revealWidth || 84;
  var xState = React.useState(0);
  var x = xState[0], setX = xState[1];
  var draggingState = React.useState(false);
  var dragging = draggingState[0], setDragging = draggingState[1];
  var removingState = React.useState(false);
  var removing = removingState[0], setRemoving = removingState[1];

  var startXRef = React.useRef(0);
  var startTranslateRef = React.useRef(0);
  var movedRef = React.useRef(false);

  function clamp(v) { return Math.max(-revealWidth, Math.min(0, v)); }

  function handleDown(e) {
    if (removing) return;
    movedRef.current = false;
    startXRef.current = e.clientX;
    startTranslateRef.current = x;
    setDragging(true);
    if (e.target.setPointerCapture) {
      try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
  }
  function handleMove(e) {
    if (!dragging) return;
    var dx = e.clientX - startXRef.current;
    if (Math.abs(dx) > 4) movedRef.current = true;
    setX(clamp(startTranslateRef.current + dx));
  }
  function handleUp() {
    if (!dragging) return;
    setDragging(false);
    setX(function (cur) { return cur < -revealWidth / 2 ? -revealWidth : 0; });
  }

  function handleRowClick() {
    if (movedRef.current) { movedRef.current = false; return; }
    if (x !== 0) { setX(0); return; }
    if (props.onClick) props.onClick();
  }

  function handleDelete() {
    setX(-400);
    setRemoving(true);
    window.setTimeout(function () { props.onDelete(); }, 260);
  }

  return (
    <div
      className="relative overflow-hidden rounded-[22px]"
      style={{
        maxHeight: removing ? 0 : 200,
        opacity: removing ? 0 : 1,
        marginBottom: removing ? 0 : undefined,
        transition: 'max-height 0.26s ease 0.05s, opacity 0.2s ease, margin 0.26s ease 0.05s',
      }}
    >
      <div className="absolute inset-y-0 right-0 flex" style={{ width: revealWidth }}>
        <button
          onClick={handleDelete}
          aria-label="Удалить"
          className="flex-1 flex items-center justify-center text-white text-[13px] font-medium rounded-[22px]"
          style={{ background: '#E24141' }}
        >
          Удалить
        </button>
      </div>
      <div
        onPointerDown={handleDown}
        onPointerMove={handleMove}
        onPointerUp={handleUp}
        onPointerCancel={handleUp}
        onClick={handleRowClick}
        style={{
          transform: 'translateX(' + x + 'px)',
          transition: dragging ? 'none' : 'transform 0.28s cubic-bezier(.2,.8,.3,1)',
          touchAction: 'pan-y',
        }}
        className="relative"
      >
        {props.children}
      </div>
    </div>
  );
}

// Уменьшает загруженное фото до разумного размера и переводит в JPEG,
// чтобы не раздувать localStorage — фото хранится только в браузере
// пользователя, как и остальной прогресс.
function resizeImageFile(file, maxSize) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('read failed')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('decode failed')); };
      img.onload = function () {
        var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

var HANZI_VOICE_TEST_TEXT = '你好';

// Голоса озвучки — показываем только реально распространённые китайские
// голоса с человеческими именами (Huihui/Kangkang/Yaoyao — стандартные

var KNOWN_VOICE_NAMES = ['Huihui', 'Kangkang', 'Yaoyao'];

function SettingsScreen(props) {
  var settings = props.settings;

      var all = window.speechSynthesis.getVoices();
      var zh = all.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('zh') === 0; });
      var known = zh.filter(function (v) {
        return KNOWN_VOICE_NAMES.some(function (n) { return v.name.indexOf(n) !== -1; });
      });
      setVoices(known.length ? known : zh);

    window.speechSynthesis.onvoiceschanged = loadVoices;

  // быть заблокирован и молча ничего не делать, из-за чего кнопка выглядит
  // "нерабочей")
  function handleResetClick() {
    if (!confirming) {
      setConfirming(true);
      confirmTimerRef.current = window.setTimeout(function () { setConfirming(false); }, 3500);
      return;
    }
    if (confirmTimerRef.current) window.clearTimeout(confirmTimerRef.current);
    setConfirming(false);

  function patch(fields) {
    onChangeSettings(Object.assign({}, settings, fields));

    var file = e.target.files && e.target.files[0];

function wordLevel(id) {
  if (id.indexOf('w5_') === 0) return 5;
  if (id.indexOf('w4_') === 0) return 4;
  if (id.indexOf('w3_') === 0) return 3;
  if (id.indexOf('w2_') === 0) return 2;
  return 1;
}

// Маленький бейдж уровня HSK 2.0 для строки слова вне словаря (уроки
// учебников, свои списки). Рендерится только если уровень слова достоверно
// известен (совпадение по иероглифу со списком HSK1/HSK2) — чтобы не
// показывать неверный уровень для лексики, которой пока нет в приложении.
function HskBadge(props) {

  return (
    <span className="text-[11px] text-black/35 border border-[#E0E0E0] rounded px-1.5 py-0.5 whitespace-nowrap">HSK{level}</span>
  );

// Карточка слова — открывается по тапу на слово в словаре: показывает
// иероглиф с автоматически запускающейся анимацией написания по чертам
// (как на карточке "Порядок черт" в тренировке), пиньинь, перевод и бейдж
// уровня HSK, плюс переход в прописи или добавление в список.
function WordDetailCard(props) {
  var word = props.word;
  var chars = uniqueChars(word.hanzi);
  var level = wordHskLevel(word);

  var charIdxState = React.useState(0);
  var charIdx = charIdxState[0], setCharIdx = charIdxState[1];
  var popState = React.useState(0);
  var popTick = popState[0], setPopTick = popState[1];
  var mountRef = React.useRef(null);
  var writerRef = React.useRef(null);

  function replay() {
    speak(chars[charIdx]);
    if (writerRef.current) { writerRef.current.hideCharacter({ duration: 0 }); writerRef.current.animateCharacter({ onComplete: onAnimateComplete }); }
  }
  function onAnimateComplete() {
    setPopTick(function (t) { return t + 1; });
    vibrate(10);
    // короткая пауза, затем следующий иероглиф слова (если он не последний)
    if (charIdx < chars.length - 1) {
      window.setTimeout(function () { setCharIdx(function (i) { return i + 1; }); }, 500);
    }
  }

  React.useEffect(function () {
    speak(chars[charIdx]);
    if (!mountRef.current || !window.HanziWriter) return;
    mountRef.current.innerHTML = '';
    var size = measureWriterSize(mountRef.current);
    var writer = window.HanziWriter.create(mountRef.current, chars[charIdx], {
      width: size,
      height: size,
      padding: 12,
      showOutline: false,
      showCharacter: false,
      strokeColor: '#000000',
      strokeAnimationSpeed: 1,
      delayBetweenStrokes: 300,
    });
    writerRef.current = writer;
    writer.animateCharacter({ onComplete: onAnimateComplete });
    return function () { writerRef.current = null; };
    // eslint-disable-next-line
  }, [charIdx, word.id]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-6">
      <div className="absolute inset-0 bg-black/30" onClick={props.onClose} />
      <div className="relative w-full max-w-[320px] bg-white rounded-[28px] overflow-hidden animate-[sheetUp_0.2s_ease]">
        <div className="flex items-center justify-between px-4 pt-3.5 pb-1">
          <button onClick={props.onClose} aria-label="Закрыть" className="w-8 h-8 rounded-full bg-[#F2F2F2] flex items-center justify-center">
            <IconClose size={15} />
          </button>
          {level ? (
            <span className="text-[11px] text-black/45 border border-[#E5E5E5] rounded-full px-2.5 py-1">HSK {level}</span>
          ) : <span />}
          <button onClick={replay} aria-label="Прослушать" className="w-8 h-8 rounded-full bg-[#F2F2F2] flex items-center justify-center">
            <IconSpeaker size={15} />
          </button>
        </div>

        <div className="mx-4 mb-1" style={{ height: 220 }}>
          <div onClick={replay} className="cursor-pointer w-full h-full">
            <BigWriterBox mountRef={mountRef} popSignal={popTick} />
          </div>
        </div>

        {chars.length > 1 && (
          <div className="flex items-center justify-center pb-1">
            <CharDots total={chars.length} active={charIdx} />
          </div>
        )}

        <div className="text-center px-5 pt-2 pb-1">
          <div className="text-[18px] font-medium">{word.translation}</div>
          <div className="text-[13px] text-black/40 mt-0.5">{word.pinyin}</div>
        </div>

        <div className="p-4 pt-3 flex items-center gap-2">
          <button
            onClick={function () { props.onPractice(word); }}
            className="flex-1 py-3 rounded-2xl bg-[#F5F5F5] text-[13px] font-medium flex items-center justify-center gap-1.5"
          >
            <IconEdit size={15} />Пропись
          </button>
          <button
            onClick={function () { props.onAddToList(word); }}
            className="flex-1 py-3 rounded-2xl bg-black text-white text-[13px] font-medium flex items-center justify-center gap-1.5"
          >
            <IconPlus size={15} />В список
          </button>
        </div>
      </div>
    </div>
  );
}

// ==========================================================================
// ЭКРАН 3: Списки — HSK 2.0 (по уровням), Учебники, списки по темам и свои списки
// ==========================================================================
// Каталог учебников — поиск + алфавитная группировка, как в справочных приложениях.
// Пока это витрина: словари по главам появятся позже, поэтому все пункты
// помечены "скоро", без картинок обложек.
// Каталог учебников — просто список, в один ряд по алфавиту, как в
// справочных приложениях. Без описаний, без вложенных экранов: тап по
// строке пока ничего не открывает — содержимое появится позже.
function TextbooksTab(props) {
  var qState = React.useState('');
  var query = qState[0], setQuery = qState[1];
  var openBookState = React.useState(null);
  var openBook = openBookState[0], setOpenBook = openBookState[1];

  if (openBook) {
    return <TextbookLessonsView book={openBook} progress={props.progress} onStartSession={props.onStartSession} onBack={function () { setOpenBook(null); }} />;
  }

  var q = query.trim().toLowerCase();
  var filtered = q
    ? TEXTBOOKS.filter(function (tb) {
        return tb.title.toLowerCase().indexOf(q) !== -1 || tb.author.toLowerCase().indexOf(q) !== -1;
      })
    : TEXTBOOKS;

  var sorted = filtered.slice().sort(function (a, b) { return a.title.localeCompare(b.title); });
  var groups = [];
  var lastLetter = null;
  sorted.forEach(function (tb) {
    var letter = tb.title.charAt(0).toUpperCase();
    if (letter !== lastLetter) {
      groups.push({ letter: letter, items: [] });
      lastLetter = letter;
    }
    groups[groups.length - 1].items.push(tb);
  });

  return (
    <div>
      <div className="flex items-center gap-2 bg-white border border-[#E0E0E0] rounded-[22px] px-4 py-3 mb-4">
        <IconSearch active={false} />

// Панель живого поиска для добавления слов в конкретный список (см. референс "Add word")
function AddWordSearchPanel(props) {
  var qState = React.useState('');
  var query = qState[0], setQuery = qState[1];
  var addedState = React.useState({});
  var added = addedState[0], setAdded = addedState[1];

  var results = query.trim() ? ALL_WORDS.filter(function (w) { return matchesQuery(w, query); }) : ALL_WORDS;

  function handleToggle(word, isAdded) {
    if (isAdded) {
      props.onRemove(word.id);
      setAdded(function (prev) {
        var next = {}; Object.assign(next, prev); next[word.id] = false; return next;
      });
    } else {
      props.onAdd(word.id);
      setAdded(function (prev) {
        var next = {}; Object.assign(next, prev); next[word.id] = true; return next;
      });
    }
  }

  return (
    <div className="flex flex-col gap-3">
      <div className="flex items-center gap-2 bg-white border border-[#E0E0E0] rounded-[22px] px-4 py-2.5">
        <IconSearch active={false} />
        <input
          autoFocus
          value={query}
          onChange={function (e) { setQuery(e.target.value); }}
          placeholder="Иероглиф, пиньинь или перевод"
          className="flex-1 outline-none text-[15px] placeholder:text-black/30"
        />
      </div>
      <div className="max-h-[45vh] overflow-y-auto pr-3">
        {results.map(function (w) {
          var already = added[w.id] !== undefined ? added[w.id] : props.existingIds.indexOf(w.id) !== -1;
          return (
            <div key={w.id} className="flex items-center justify-between py-3 border-b border-[#EEEEEE]">
              <div className="flex flex-col">
                <span className="font-zh text-2xl leading-tight">{w.hanzi}</span>
                <span className="text-[13px] text-black/50 mt-1">{w.translation}</span>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-[13px] text-black/70">{w.pinyin}</span>
                <button
                  onClick={function () { handleToggle(w, already); }}
                  aria-label={already ? 'Убрать слово' : 'Добавить слово'}
                  className={'w-8 h-8 rounded-full border flex items-center justify-center shrink-0 ' + (already ? 'border-black bg-black text-white' : 'border-[#E0E0E0]')}
                >
                  {already ? <IconCheck size={14} /> : <IconPlus size={14} />}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Шапка тренировки: круглая кнопка назад, заголовок шага, меню, прогресс.
// Озвучка теперь только автоматическая (при появлении иероглифа) плюс по тапу

// --- Шаг 1: Смотри — простая карточка: иероглиф + чтение + перевод, плавное появление ---
function LookCard(props) {
  var word = props.word;
  var phaseState = React.useState(0);
  var phase = phaseState[0], setPhase = phaseState[1];

  React.useEffect(function () {
    setPhase(0);
    speak(word.hanzi);
    var t1 = window.setTimeout(function () { setPhase(1); }, 60);
    var t2 = window.setTimeout(function () { setPhase(2); }, 480);
    return function () { window.clearTimeout(t1); window.clearTimeout(t2); };
    // eslint-disable-next-line
  }, [word.id]);

  return (
    <div className="flex-1 flex flex-col px-6 pb-6">
      <div className="flex-1 rounded-[36px] bg-[#FAFAFA] border border-[#EFEFEF] flex flex-col items-center justify-center gap-2">
        <span
          onClick={function () { speak(word.hanzi); }}
          className="font-zh text-4xl cursor-pointer"
          style={{
            opacity: phase >= 1 ? 1 : 0,
            transform: phase >= 1 ? 'scale(1)' : 'scale(0.85)',
            transition: 'opacity 0.45s ease, transform 0.45s cubic-bezier(.2,.8,.3,1)',
          }}
        >
          {word.hanzi}
        </span>
        <div
          className="flex flex-col items-center gap-1 mt-1"
          style={{
            opacity: phase >= 2 ? 1 : 0,
            transform: phase >= 2 ? 'translateY(0)' : 'translateY(10px)',
            transition: 'opacity 0.4s ease, transform 0.4s cubic-bezier(.2,.8,.3,1)',
          }}
        >
          <span className="text-[14px] text-black/50">{word.pinyin}</span>
          <span className="text-[15px] font-medium text-center px-6">{word.translation}</span>
        </div>

}

// --- Шаг 2: Порядок черт — настоящая анимация того, как иероглиф пишется ---
function StrokeAnimationCard(props) {
  var word = props.word;
  var onNext = props.onNext;
  var chars = uniqueChars(word.hanzi);

  var charIdxState = React.useState(0);
  var charIdx = charIdxState[0], setCharIdx = charIdxState[1];
  var popState = React.useState(0);
  var popTick = popState[0], setPopTick = popState[1];
  var mountRef = React.useRef(null);
  var writerRef = React.useRef(null);
  var isLast = charIdx === chars.length - 1;

  function goNext() {
    if (isLast) onNext();
    else setCharIdx(charIdx + 1);
  }
  function replay() {
    speak(chars[charIdx]);
    if (writerRef.current) { writerRef.current.hideCharacter({ duration: 0 }); writerRef.current.animateCharacter({ onComplete: onAnimateComplete }); }
  }
  function onAnimateComplete() {
    setPopTick(function (t) { return t + 1; });
    vibrate(10);
  }

  React.useEffect(function () {
    speak(chars[charIdx]);
    if (!mountRef.current || !window.HanziWriter) return;
    mountRef.current.innerHTML = '';
    var size = measureWriterSize(mountRef.current);
    var writer = window.HanziWriter.create(mountRef.current, chars[charIdx], {
      width: size,

      padding: 14,
      showOutline: false,

    writerRef.current = writer;
    writer.animateCharacter({ onComplete: onAnimateComplete });
    return function () { writerRef.current = null; };
    // eslint-disable-next-line
  }, [charIdx]);

  return (
    <div className="flex-1 flex flex-col px-5 pt-3 pb-6">
      <div className="flex flex-col items-center gap-0.5 pt-1 pb-1 px-6">

        <span className="text-[13px] text-black/35 leading-tight">{word.pinyin}</span>
      </div>

// --- Читаем без пиньиня (повторение уже изученных слов): случайное направление, свайп/кнопки ---
function RecognitionCard(props) {
  var word = props.word;
  var direction = props.direction; // 'char2trans' | 'trans2char'
  var onResolve = props.onResolve;

  var flippedState = React.useState(false);
  var flipped = flippedState[0], setFlipped = flippedState[1];
  var dragState = React.useState({ x: 0, dragging: false });
  var drag = dragState[0], setDrag = dragState[1];
  var exitState = React.useState(null);
  var exiting = exitState[0], setExiting = exitState[1];

  var startRef = React.useRef(null);
  var dxRef = React.useRef(0);
  var movedRef = React.useRef(false);

  React.useEffect(function () {
    speak(word.hanzi);
    // eslint-disable-next-line
  }, [word.id]);

  function handleDown(e) {
    if (exiting) return;
    startRef.current = { x: e.clientX };
    movedRef.current = false;
    dxRef.current = 0;
    setDrag({ x: 0, dragging: true });
    if (e.target.setPointerCapture) {
      try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
  }
  function handleMove(e) {
    if (!startRef.current || exiting) return;
    var dx = e.clientX - startRef.current.x;
    if (Math.abs(dx) > 6) movedRef.current = true;
    dxRef.current = dx;
    setDrag({ x: dx, dragging: true });
  }
  function handleUp() {
    if (!startRef.current || exiting) return;
    var dx = dxRef.current;
    var threshold = 90;
    startRef.current = null;
    if (Math.abs(dx) > threshold) {
      commit(dx > 0 ? 'right' : 'left');
    } else if (!movedRef.current) {
      setFlipped(function (f) { return !f; });
      setDrag({ x: 0, dragging: false });
    } else {
      setDrag({ x: 0, dragging: false });
    }
  }
  function commit(direction2) {
    if (exiting) return;
    setExiting(direction2);
    window.setTimeout(function () { onResolve(direction2 === 'right'); }, 260);
  }

  var dx = exiting ? (exiting === 'right' ? 560 : -560) : drag.x;
  var rotate = dx / 18;
  var scale = exiting ? 0.92 : 1;
  var cardStyle = {
    transform: 'translateX(' + dx + 'px) rotate(' + rotate + 'deg) scale(' + scale + ')',
    transition: drag.dragging ? 'none' : 'transform 0.3s cubic-bezier(.2,.8,.3,1), opacity 0.3s ease',
    opacity: exiting ? 0 : 1,
  };
  var knowOpacity = Math.max(0, Math.min(1, dx / 90));
  var dontKnowOpacity = Math.max(0, Math.min(1, -dx / 90));
  var tintT = Math.max(-1, Math.min(1, dx / 130));
  var borderColor = tintT >= 0 ? lerpColor('#EFEFEF', '#8FCB9E', tintT) : lerpColor('#EFEFEF', '#E8A3A3', -tintT);
  var mainIsHanzi = direction === 'char2trans';

  return (
    <div className="flex-1 flex flex-col px-6 pb-4">
      <div className="flex-1 flex items-center justify-center relative select-none" style={{ touchAction: 'pan-y' }}>
        <div
          onPointerDown={handleDown}
          onPointerMove={handleMove}
          onPointerUp={handleUp}
          onPointerCancel={handleUp}
          style={Object.assign({ borderColor: borderColor }, cardStyle)}
          className="w-full max-w-[300px] aspect-[3/4] rounded-[40px] bg-[#FAFAFA] border flex flex-col items-center justify-center relative cursor-pointer"
        >
          <div className="absolute left-6 top-6 text-black" style={{ opacity: dontKnowOpacity }}><IconCross size={28} /></div>
          <div className="absolute right-6 top-6 text-black" style={{ opacity: knowOpacity }}><IconCheck size={28} /></div>

          {mainIsHanzi ? (
            <span className="font-zh text-6xl">{word.hanzi}</span>
          ) : (
            <span className="text-[22px] font-medium text-center px-6">{word.translation}</span>
          )}

          {flipped ? (
            <div className="mt-5 flex flex-col items-center gap-1">
              {mainIsHanzi ? (
                <React.Fragment>
                  <span className="text-[15px] text-black/70">{word.pinyin}</span>
                  <span className="text-[15px]">{word.translation}</span>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <span className="font-zh text-4xl">{word.hanzi}</span>
                  <span className="text-[14px] text-black/60 mt-1">{word.pinyin}</span>
                </React.Fragment>
              )}
            </div>
          ) : null}
        </div>
      </div>

      <div className="flex items-center justify-center gap-4 py-4">
        <CircleActionButton size={60} onClick={function () { commit('left'); }}><IconCross size={24} /></CircleActionButton>
        <CircleActionButton size={60} filled onClick={function () { commit('right'); }}><IconCheck size={24} /></CircleActionButton>
      </div>
    </div>
  );
}

// Точки-пагинация, когда в слове несколько иероглифов и мы идём по одному
function CharDots(props) {
  if (props.total <= 1) return null;
  return (
    <div className="flex items-center gap-1.5">
      {Array.from({ length: props.total }).map(function (_, i) {
        return <span key={i} className={'rounded-full ' + (i === props.active ? 'bg-black w-5 h-1.5' : 'bg-[#E0E0E0] w-1.5 h-1.5')} style={{ transition: 'all 0.2s ease' }} />;
      })}
    </div>
  );
}

// Общий контейнер прописи — серая панель (как у карточки слова) с гигантским
// символом по центру и еле заметной сеткой 米字格
function BigWriterBox(props) {
  var boxRef = React.useRef(null);
  var charRef = React.useRef(null);
  React.useEffect(function () {
    if (!props.shakeSignal || !charRef.current) return;
    var el = charRef.current;
    el.classList.remove('animate-shake');
    void el.offsetWidth; // форсируем reflow, чтобы анимация перезапустилась
    el.classList.add('animate-shake');
  }, [props.shakeSignal]);
  React.useEffect(function () {
    if (!props.popSignal || !charRef.current) return;
    var el = charRef.current;
    el.classList.remove('animate-pop');
    void el.offsetWidth;
    el.classList.add('animate-pop');
  }, [props.popSignal]);
  var boxStyle = props.tintColor ? { backgroundColor: props.tintColor, transition: 'background-color 0.25s ease' } : undefined;
  return (
    <div ref={boxRef} style={boxStyle} className="relative w-full h-full rounded-[36px] bg-[#FAFAFA] border border-[#EFEFEF] flex items-center justify-center overflow-hidden">
      <div className="relative" style={{ width: '92%', maxWidth: 380, aspectRatio: '1 / 1' }}>
        {/* Сетка-подсказка — не анимируется, всегда неподвижна. Двигается/трясётся
            только сам иероглиф (слой ниже), чтобы разметка не "прыгала" вместе с ним. */}
        <svg className="absolute inset-0 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="50" y1="0" x2="50" y2="100" stroke="#EAEAE6" strokeWidth="0.5" strokeDasharray="1.5 3" />
          <line x1="0" y1="50" x2="100" y2="50" stroke="#EAEAE6" strokeWidth="0.5" strokeDasharray="1.5 3" />
          <line x1="0" y1="0" x2="100" y2="100" stroke="#EAEAE6" strokeWidth="0.5" strokeDasharray="1.5 3" />
          <line x1="100" y1="0" x2="0" y2="100" stroke="#EAEAE6" strokeWidth="0.5" strokeDasharray="1.5 3" />
        </svg>
        <div ref={charRef} className="absolute inset-0">
          <div ref={props.mountRef} className="absolute inset-0" />
        </div>
      </div>
    </div>
  );
}

// Вычисляет реальный пиксельный размер для HanziWriter по размеру уже отрисованного контейнера
function measureWriterSize(mountEl) {
  var box = mountEl && mountEl.parentElement;
  var w = box ? box.clientWidth : 0;
  return Math.max(160, Math.min(w || 320, 420));
}

// --- Шаг 3: Обведи иероглиф — настоящая пропись поверх образца (реальные черты, порядок, направление) ---
function TraceCard(props) {
  var word = props.word;
  var onNext = props.onNext;
  var chars = uniqueChars(word.hanzi);

  var charIdxState = React.useState(0);
  var charIdx = charIdxState[0], setCharIdx = charIdxState[1];
  var shakeState = React.useState(0);
  var shakeTick = shakeState[0], setShakeTick = shakeState[1];
  var popState = React.useState(0);
  var popTick = popState[0], setPopTick = popState[1];
  var mountRef = React.useRef(null);
  var writerRef = React.useRef(null);

  function goNext() {
    if (charIdx < chars.length - 1) setCharIdx(charIdx + 1);
    else onNext();
  }

  React.useEffect(function () {
    speak(chars[charIdx]);
    if (!mountRef.current || !window.HanziWriter) return;
    mountRef.current.innerHTML = '';
    var size = measureWriterSize(mountRef.current);
    var writer = window.HanziWriter.create(mountRef.current, chars[charIdx], {
      width: size,
      height: size,
      padding: 14,
      showOutline: true,
      showCharacter: false,
      outlineColor: '#D8D8D8',
      strokeColor: '#000000',
      drawingColor: '#000000',
      highlightColor: '#000000',
      drawingWidth: 5,
      strokeWidth: 5,
      showHintAfterMisses: 1,
      highlightOnComplete: true,
    });
    writerRef.current = writer;
    writer.quiz({
      onMistake: function () { setShakeTick(function (t) { return t + 1; }); vibrate(12); },
      onComplete: function () {
        setPopTick(function (t) { return t + 1; });
        vibrate(10);
        window.setTimeout(goNext, 350);
      },
    });
    return function () {
      try { writer.cancelQuiz(); } catch (e) { /* ignore */ }
      writerRef.current = null;
    };
    // eslint-disable-next-line
  }, [charIdx]);

  return (
    <div className="flex-1 flex flex-col px-5 pt-3 pb-6">

      <div className="flex items-center justify-center pt-2">

      </div>

      <div className="flex-1 flex mt-3">

      <div className="flex items-center justify-center mt-4">

      </div>
    </div>

// --- Шаг 4: Пиши от руки — по памяти, реальная проверка каждой черты, один символ на экран ---
function WritingCard(props) {
  var word = props.word;
  var onResolve = props.onResolve;
  var chars = uniqueChars(word.hanzi);

  var charIdxState = React.useState(0);
  var charIdx = charIdxState[0], setCharIdx = charIdxState[1];
  var shakeState = React.useState(0);
  var shakeTick = shakeState[0], setShakeTick = shakeState[1];
  var exitPhaseState = React.useState(null); // null | 'tint' | 'fly'
  var exitPhase = exitPhaseState[0], setExitPhase = exitPhaseState[1];
  var exitDirRef = React.useRef(null);
  var mistakesRef = React.useRef(0);
  var mountRef = React.useRef(null);
  var writerRef = React.useRef(null);
  var isLast = charIdx === chars.length - 1;

  function useHint() {
    if (writerRef.current) {
      try { writerRef.current.skipQuizStroke(); } catch (e) { /* ignore */ }
    }
  }

  React.useEffect(function () {
    speak(chars[charIdx]);
    if (!mountRef.current || !window.HanziWriter) return;
    mountRef.current.innerHTML = '';
    var size = measureWriterSize(mountRef.current);
    var charMistakes = 0;
    var writer = window.HanziWriter.create(mountRef.current, chars[charIdx], {
      width: size,
      height: size,
      padding: 14,
      showOutline: false,
      showCharacter: false,
      strokeColor: '#000000',
      drawingColor: '#000000',
      highlightColor: '#000000',
      drawingWidth: 5,
      strokeWidth: 5,
      showHintAfterMisses: 3,
      markStrokeCorrectAfterMisses: 6,
      highlightOnComplete: true,
    });
    writerRef.current = writer;
    writer.quiz({
      onMistake: function () { charMistakes += 1; setShakeTick(function (t) { return t + 1; }); vibrate(12); },
      onComplete: function () {
        window.setTimeout(function () {
          mistakesRef.current += charMistakes;
          if (isLast) {
            var correct = mistakesRef.current <= 3;
            exitDirRef.current = correct ? 'right' : 'left';
            vibrate(correct ? 22 : [15, 50, 15]);
            // фаза 1: карточка стоит на месте и хорошо видно, как она зеленеет/краснеет
            setExitPhase('tint');
            window.setTimeout(function () {
              // фаза 2: только теперь она уезжает в сторону и исчезает
              setExitPhase('fly');
              window.setTimeout(function () { onResolve(correct); }, 340);
            }, 260);
          } else {
            setCharIdx(charIdx + 1);
          }
        }, 300);
      },
    });
    return function () {
      try { writer.cancelQuiz(); } catch (e) { /* ignore */ }
      writerRef.current = null;
    };
    // eslint-disable-next-line
  }, [charIdx]);

  var flying = exitPhase === 'fly';
  var tinted = exitPhase === 'tint' || flying;
  var dir = exitDirRef.current;
  var dx = flying ? (dir === 'right' ? 560 : -560) : 0;
  var tintColor = dir === 'right' ? '#B9E6C4' : '#F3B9B9';
  var panelStyle = {
    transform: 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg) scale(' + (flying ? 0.92 : 1) + ')',
    transition: flying
      ? 'transform 0.34s cubic-bezier(.2,.8,.3,1), opacity 0.34s ease'
      : undefined,
    opacity: flying ? 0 : 1,
  };

  return (
    <div className="flex-1 flex flex-col px-5 pt-3 pb-6">
      <div style={panelStyle} className="flex-1 w-full flex flex-col">
        <div className="flex flex-col items-center gap-0.5 pt-1 px-6">
          <span className="text-[15px] font-medium leading-snug text-center">{word.translation}</span>
          <span className="text-[13px] text-black/35 leading-tight">{word.pinyin}</span>
        </div>

        <div className="flex items-center justify-center pt-2 pb-1">
          <CharDots total={chars.length} active={charIdx} />
        </div>

        <div className="flex-1 flex">
          <BigWriterBox mountRef={mountRef} shakeSignal={shakeTick} tintColor={tinted ? tintColor : null} />
        </div>
      </div>

      <div className="flex items-center justify-center mt-4">
        <CircleActionButton size={48} onClick={useHint}><IconLightbulb size={20} /></CircleActionButton>
      </div>
    </div>
  );
}

// --- Обёртка сессии: строит очередь и ведёт по шагам, с сохранением позиции ---
function SessionScreen(props) {
  var scope = props.scope; // { wordIds, title, listId?, reviewOnly? }
  var progress = props.progress;
  var onResolveCard = props.onResolveCard; // (wordId, action, data)
  var onDeleteFromList = props.onDeleteFromList; // (wordId) | undefined
  var onResetProgressWords = props.onResetProgressWords; // (wordIds) => void
  var onExit = props.onExit;

  var sessionKeyRef = React.useRef(sessionKeyFor(scope));
  var savedRef = React.useRef(loadSessionState());

  var queueState = React.useState(function () {
    var saved = savedRef.current;
    if (saved && saved.key === sessionKeyRef.current && saved.queue && saved.queue.length) {
      return saved.queue;
    }
    var now = Date.now();
    return scope.reviewOnly
      ? buildReviewQueue(progress, scope.wordIds, now, scope.reviewMode)
      : buildSessionQueue(progress, scope.wordIds, now);
  });
  var queue = queueState[0];
  var indexState = React.useState(function () {
    var saved = savedRef.current;
    if (saved && saved.key === sessionKeyRef.current) return saved.index || 0;
    return 0;
  });
  var index = indexState[0], setIndex = indexState[1];

  // сохраняем позицию при каждом шаге, чтобы вернуться на то же место позже
  React.useEffect(function () {
    if (queue.length === 0) return;
    if (index >= queue.length) { clearSessionState(); return; }
    saveSessionState(sessionKeyRef.current, queue, index);
    // eslint-disable-next-line
  }, [index]);

  function handleResetProgress() {
    var ok = window.confirm('Сбросить весь прогресс по этим словам? Это действие нельзя отменить.');
    if (!ok) return;
    clearSessionState();
    onResetProgressWords(scope.wordIds);
    onExit();
  }

  if (queue.length === 0) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center gap-4 px-8 text-center">
        <IconCircleCheck size={40} />
        <p className="text-[15px] text-black/60">Все слова из «{scope.title}» уже повторены. Загляните позже!</p>
        <button onClick={onExit} className="px-6 py-3 rounded-full bg-black text-white text-[14px] font-medium">Назад</button>
      </div>
    );
  }
  if (index >= queue.length) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center gap-4 px-8 text-center">
        <IconCircleCheck size={40} />
        <p className="text-[15px] font-medium">Готово! Вы повторили {queue.length} {queue.length === 1 ? 'карточку' : 'карточек'}.</p>
        <button onClick={onExit} className="px-6 py-3 rounded-full bg-black text-white text-[14px] font-medium">Вернуться</button>
      </div>
    );
  }

  var task = queue[index];
  var word = WORDS_BY_ID[task.wordId];
  var stepTitles = { look: 'Смотрите', animate: 'Порядок черт', recognize: 'Читайте без пиньиня', trace: 'Обведите иероглиф', write: 'Пишите от руки' };

  function advance() { setIndex(function (i) { return i + 1; }); }

  var deleteHandler = onDeleteFromList
    ? function () { onDeleteFromList(task.wordId); advance(); }
    : null;

  function handleRecognizeResolve(correct) {
    onResolveCard(task.wordId, 'recognize', correct);
    advance();
  }
  function handleWriteResolve(correct) {
    if (task.isIntro) {
      onResolveCard(task.wordId, 'introComplete', correct);
    } else {
      onResolveCard(task.wordId, 'write', correct);
    }
    advance();
  }

  return (
    <div className="flex-1 flex flex-col min-h-0">
      <SessionHeader title={stepTitles[task.kind]} index={index} total={queue.length} onExit={onExit} onResetProgress={handleResetProgress} />

      {task.kind === 'look' && (
        <LookCard key={task.wordId + '-look-' + index} word={word} onNext={advance} />
      )}
      {task.kind === 'animate' && (
        <StrokeAnimationCard key={task.wordId + '-animate-' + index} word={word} onNext={advance} />
      )}
      {task.kind === 'recognize' && (
        <RecognitionCard
          key={task.wordId + '-recognize-' + index}
          word={word}
          direction={task.direction}
          onResolve={handleRecognizeResolve}
          onDelete={deleteHandler}
        />
      )}
      {task.kind === 'trace' && (
        <TraceCard key={task.wordId + '-trace-' + index} word={word} onNext={advance} onDelete={deleteHandler} />
      )}
      {task.kind === 'write' && (
        <WritingCard
          key={task.wordId + '-write-' + index}
          word={word}
          onResolve={handleWriteResolve}
          onDelete={deleteHandler}
        />
      )}
    </div>
  );
}

function App() {

  var settings = settingsState[0], setSettings = settingsState[1];

  var sessionState = React.useState(null); // { wordIds, title, listId?, reviewOnly? } | null
  var session = sessionState[0], setSession = sessionState[1];

  // Персистентность — сохраняем в localStorage браузера пользователя
  React.useEffect(function () { saveProgress(progress); }, [progress]);
  React.useEffect(function () { saveLists(lists); }, [lists]);
  React.useEffect(function () { saveActivity(activityLog); }, [activityLog]);
  React.useEffect(function () {
    saveSettings(settings);
    currentVoiceURI = settings.voiceURI || '';
    currentVibrationEnabled = settings.vibration !== false;
  }, [settings]);

  function handleResolveCard(wordId, action, data) {
    var current = getProgress(progress, wordId);
    var wasLearned = current.stage >= LEARNED_STAGE;
    var updated = action === 'introComplete'
      ? introStartState(!!data)
      : nextStageState(current, !!data); // action — 'recognize' | 'write'

    setProgress(function (prev) {
      var next = {};
      Object.assign(next, prev);
      next[wordId] = updated;
      return next;
    });

    var key = todayKey();

    if (!wasLearned && updated.stage >= LEARNED_STAGE) {
      setActivityLog(function (prev) { return bumpActivity(prev, key, 1); });
    }
  }

  function handleCreateList(name) {
    var id = 'list-' + Date.now() + '-' + Math.round(Math.random() * 1000);
    setLists(function (prev) { return prev.concat([{ id: id, name: name, wordIds: [] }]); });
    return id;
  }

  function handleAddWordToList(listId, wordId) {
    setLists(function (prev) {
      return prev.map(function (list) {
        if (list.id !== listId) return list;
        if (list.wordIds.indexOf(wordId) !== -1) return list;
        return Object.assign({}, list, { wordIds: list.wordIds.concat([wordId]) });
      });
    });
  }

  function handleRemoveWordFromList(listId, wordId) {
    setLists(function (prev) {
      return prev.map(function (list) {
        if (list.id !== listId) return list;
        return Object.assign({}, list, { wordIds: list.wordIds.filter(function (id) { return id !== wordId; }) });
      });
    });
  }

  function handleDeleteList(listId) {
    setLists(function (prev) { return prev.filter(function (list) { return list.id !== listId; }); });
  }

  function handleResetProgressWords(wordIds) {
    setProgress(function (prev) {
      var next = {};
      Object.assign(next, prev);
      wordIds.forEach(function (id) { delete next[id]; });
      return next;
    });
  }

  function handleResetAllProgress() {
    setProgress({});
    setActivityLog({});
  }

  function handleExportData() {
    var data = {
      exportedAt: new Date().toISOString(),
      progress: JSON.parse(localStorage.getItem(STORAGE_PROGRESS_KEY) || '{}'),
      lists: JSON.parse(localStorage.getItem(STORAGE_LISTS_KEY) || '[]'),
      activityLog: JSON.parse(localStorage.getItem(STORAGE_ACTIVITY_KEY) || '{}'),
      profile: JSON.parse(localStorage.getItem(STORAGE_PROFILE_KEY) || 'null'),
      settings: JSON.parse(localStorage.getItem(STORAGE_SETTINGS_KEY) || 'null'),
    };
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'hanzi-progress-' + todayKey() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) { /* ignore */ }
  }

  function handleImportData(data) {
    if (data.progress) localStorage.setItem(STORAGE_PROGRESS_KEY, JSON.stringify(data.progress));
    if (data.lists) localStorage.setItem(STORAGE_LISTS_KEY, JSON.stringify(data.lists));
    if (data.activityLog) localStorage.setItem(STORAGE_ACTIVITY_KEY, JSON.stringify(data.activityLog));
    if (data.profile) localStorage.setItem(STORAGE_PROFILE_KEY, JSON.stringify(data.profile));
    if (data.settings) localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(data.settings));
    window.setTimeout(function () { window.location.reload(); }, 600);
  }

  function startSession(wordIds, title, listId, reviewOnly, reviewMode) {
    setSession({ wordIds: wordIds, title: title, listId: listId || null, reviewOnly: !!reviewOnly, reviewMode: reviewMode || 'auto' });
  }

  var isDark = settings.theme === 'dark';
  // Тёмная тема сделана через CSS-фильтр (частичная инверсия + поворот
  // оттенка) на всё приложение целиком — так на почти чёрно-белом интерфейсе
  // можно получить приличную тёмную тему, не переписывая вручную сотни
  // цветов по всему файлу. invert(0.85), а не полный invert(1) — чтобы
  // получился мягкий серый, а не режущий глаз чёрно-белый негатив.
  // Фотографии/аватар компенсируются обратным фильтром (см. стили
  // .theme-dark .avatar-photo).
  var innerStyle = isDark ? { filter: 'invert(0.85) hue-rotate(180deg)' } : undefined;

  return (
    <div className="h-[100dvh] w-full flex justify-center overflow-hidden" style={{ background: isDark ? '#242424' : '#F7F7F7' }}>
      <div className={'w-full max-w-md h-[100dvh] bg-white border-x border-[#EFEFEF] flex flex-col overflow-hidden relative' + (isDark ? ' theme-dark' : '')} style={innerStyle}>
        {session ? (
          <SessionScreen
            scope={session}
            progress={progress}
            onResolveCard={handleResolveCard}
            onDeleteFromList={session.listId ? function (wordId) { handleRemoveWordFromList(session.listId, wordId); } : null}
            onResetProgressWords={handleResetProgressWords}
            onExit={function () { setSession(null); }}
          />
        ) : (
          <React.Fragment>
            {tab === 'dashboard' && (
              <DashboardScreen
                progress={progress}
                activityLog={activityLog}
                settings={settings}
                onStartSession={startSession}
                onGoToLists={function () { setTab('lists'); }}
              />
            )}
            {tab === 'dictionary' && (
              <DictionaryScreen lists={lists} onAddWordToList={handleAddWordToList} onCreateList={handleCreateList} onStartSession={startSession} />
            )}
            {tab === 'lists' && (
              <ListsScreen
                progress={progress}
                lists={lists}
                onStartSession={startSession}
                onCreateList={handleCreateList}
                onAddWordToList={handleAddWordToList}
                onRemoveWordFromList={handleRemoveWordFromList}
                onDeleteList={handleDeleteList}
              />
            )}
            {tab === 'settings' && (
              <SettingsScreen
                settings={settings}
                onChangeSettings={setSettings}
                onResetAllProgress={handleResetAllProgress}
                onExportData={handleExportData}
                onImportData={handleImportData}
              />
            )}
            <BottomNav tab={tab} setTab={setTab} />
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

var rootEl = document.getElementById('root');
var root = ReactDOM.createRoot(rootEl);
root.render(<App />);
</script>
</body>
</html>
